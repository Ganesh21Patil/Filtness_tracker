<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Fitness Coach Tax Calculator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0fdfa', 100: '#ccfbf1', 200: '#99f6e4', 300: '#5eead4', 400: '#2dd4bf', 500: '#14b8a6', 
              600: '#0d9488', 700: '#0f766e', 800: '#115e59', 900: '#134e4a'
            },
            dark: '#111827',
          }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-50 text-dark antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    const TAX_CONFIG = {
      TAX_YEAR: 2026,
      SS_WAGE_BASE: 184500,
      MILEAGE_RATE: 0.67,
      SURTAX_THRESHOLDS: { single: 200000, married: 250000 },
      STANDARD_DEDUCTIONS: { single: 16100, married: 32200 },
      FEDERAL_BRACKETS: {
        single: [
          { start: 640600, rate: 0.37 }, { start: 256225, rate: 0.35 },
          { start: 201775, rate: 0.32 }, { start: 105700, rate: 0.24 },
          { start: 50400, rate: 0.22 }, { start: 12400, rate: 0.12 }, { start: 0, rate: 0.10 },
        ],
        married: [
          { start: 768700, rate: 0.37 }, { start: 512450, rate: 0.35 },
          { start: 403550, rate: 0.32 }, { start: 211400, rate: 0.24 },
          { start: 100800, rate: 0.22 }, { start: 24800, rate: 0.12 }, { start: 0, rate: 0.10 },
        ],
      },
    };

    function calculateTaxes(inputs) {
      const num = (val) => Number(val) || 0;
      const d = inputs.deductions;
      const mileageDeduction = num(d.mileage) * TAX_CONFIG.MILEAGE_RATE;
      const deductionsSum =
        num(d.certs) + num(d.liabilityIns) + num(d.gymRent) + num(d.equipment) +
        num(d.software) + mileageDeduction + num(d.apparel) + num(d.marketing) +
        num(d.homeOffice) + num(d.other);

      const gross1099 = num(inputs.gross1099);
      const w2Wages = num(inputs.w2Wages);
      const w2Withheld = num(inputs.w2Withheld);

      const isLoss = deductionsSum > gross1099;
      const netSeProfit = Math.max(0, gross1099 - deductionsSum);
      const seTaxableIncome = netSeProfit * 0.9235;

      const wageBaseRemaining = Math.max(0, TAX_CONFIG.SS_WAGE_BASE - w2Wages);
      const ssTax = Math.min(seTaxableIncome, wageBaseRemaining) * 0.124;
      const medicareTax = seTaxableIncome * 0.029;

      const surtaxThreshold = TAX_CONFIG.SURTAX_THRESHOLDS[inputs.filingStatus];
      const combinedIncome = w2Wages + seTaxableIncome;
      const amountOverThreshold = Math.max(0, combinedIncome - surtaxThreshold);
      const surtax = amountOverThreshold * 0.009;

      const totalSeTax = ssTax + medicareTax + surtax;
      const halfSeTax = totalSeTax / 2.0;

      const netAfterHalfSe = Math.max(0, netSeProfit - halfSeTax);
      const qbiDeduction = netAfterHalfSe * 0.20;

      const standardDeduction = TAX_CONFIG.STANDARD_DEDUCTIONS[inputs.filingStatus];
      const taxableIncome = Math.max(
        0,
        w2Wages + netSeProfit - halfSeTax - qbiDeduction - standardDeduction
      );

      const brackets = TAX_CONFIG.FEDERAL_BRACKETS[inputs.filingStatus];
      let federalTax = 0;
      let remainingIncome = taxableIncome;

      for (const bracket of brackets) {
        if (remainingIncome > bracket.start) {
          const taxableInBracket = remainingIncome - bracket.start;
          federalTax += taxableInBracket * bracket.rate;
          remainingIncome = bracket.start;
        }
      }

      const totalLiability = federalTax + totalSeTax;
      const amountOwed = Math.max(0, totalLiability - w2Withheld);
      const quarterly = amountOwed / 4.0;

      return {
        netSeProfit: netSeProfit,
        seTax: {
          socialSecurity: ssTax,
          medicare: medicareTax,
          additionalMedicare: surtax,
          total: totalSeTax,
        },
        federalTax: federalTax,
        totalLiability: totalLiability,
        amountOwed: amountOwed,
        quarterlyPayment: quarterly,
        isLoss: isLoss,
      };
    }

    function DeductionInput({ label, hint, value, onChange, prefix = "$" }) {
      return (
        <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 p-3 bg-white border border-gray-100 rounded-lg shadow-sm hover:border-gray-200 transition-colors">
          <div className="flex-1">
            <label className="block text-sm font-semibold text-gray-800">{label}</label>
            <p className="text-xs text-gray-500 mt-0.5">{hint}</p>
          </div>
          <div className="relative w-full sm:w-32 flex-shrink-0">
            {prefix === "$" && <span className="absolute left-3 top-2.5 text-gray-400 font-medium">$</span>}
            <input
              type="number"
              min="0"
              value={value || ""}
              onChange={(e) => onChange(e.target.value)}
              className={`w-full rounded-md border-gray-300 shadow-sm focus:border-brand-500 focus:ring-brand-500 p-2 bg-gray-50 border text-gray-900 font-medium ${prefix === "$" ? "pl-7" : "pr-12"}`}
              placeholder="0"
            />
            {prefix !== "$" && <span className="absolute right-3 top-2.5 text-gray-400 font-medium text-sm">{prefix}</span>}
          </div>
        </div>
      );
    }

    function ResultRow({ label, value, sub, bold, highlight }) {
      return (
        <div className={`flex justify-between items-center ${sub ? "text-gray-400 text-sm pl-2" : highlight ? "text-brand-300 font-semibold" : bold ? "font-semibold text-white" : "text-gray-200"}`}>
          <span>{label}</span>
          <span>{value < 0 ? "-" : ""}${Math.abs(value).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</span>
        </div>
      );
    }

    function Calculator() {
      const resultsRef = React.useRef(null);
      const initialInputs = {
        filingStatus: "single", w2Wages: "", w2Withheld: "", gross1099: "",
        deductions: {
          certs: "", liabilityIns: "", gymRent: "", equipment: "", software: "",
          mileage: "", apparel: "", marketing: "", homeOffice: "", other: "",
        },
      };
      const [inputs, setInputs] = useState(initialInputs);

      const sanitizeNumber = (val) => {
        if (val === "") return "";
        const stringVal = String(val);
        if (stringVal.includes("-")) return stringVal.replace(/-/g, "");
        return stringVal;
      };

      const handleCalculate = () => {
        if (resultsRef.current) {
          resultsRef.current.scrollIntoView({ behavior: 'smooth' });
        }
      };

      const handleReset = () => {
        if (window.confirm("Are you sure you want to clear all fields?")) {
          setInputs(initialInputs);
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }
      };

      const handleKeyDown = (e) => {
        if (e.key === 'Enter') {
          handleCalculate();
        }
      };

      const handleInputChange = (field, value) => {
        const finalValue = field === "filingStatus" ? value : sanitizeNumber(value);
        setInputs((prev) => ({ ...prev, [field]: finalValue }));
      };

      const handleDeductionChange = (field, value) => {
        setInputs((prev) => ({
          ...prev,
          deductions: { ...prev.deductions, [field]: sanitizeNumber(value) },
        }));
      };

      const results = calculateTaxes(inputs);

      return (
        <main className="min-h-screen bg-gray-50 flex flex-col items-center py-10 px-4 sm:px-6 lg:px-8">
          <div className="w-full max-w-4xl text-center mb-10">
            <h1 className="text-4xl md:text-5xl font-extrabold text-dark tracking-tight mb-4">
              Estimate your personal trainer taxes in 60 seconds
            </h1>
            <p className="text-lg text-gray-600 max-w-2xl mx-auto">
              Built for independent trainers, gym contractors, and hybrid coaches. Find the deductions most trainers miss and see exactly what you owe.
            </p>
          </div>

          <div className="w-full max-w-4xl grid grid-cols-1 lg:grid-cols-12 gap-8">
            <div className="lg:col-span-7 space-y-8 bg-white p-6 sm:p-8 rounded-2xl shadow-sm border border-gray-100" onKeyDown={handleKeyDown}>
              <section>
                <h2 className="text-xl font-bold text-gray-900 mb-4">1. The Basics</h2>
                <div>
                  <label className="block text-sm font-medium text-gray-700 mb-1">Filing Status</label>
                  <select
                    value={inputs.filingStatus}
                    onChange={(e) => handleInputChange("filingStatus", e.target.value)}
                    className="w-full rounded-lg border-gray-300 shadow-sm focus:border-brand-500 focus:ring-brand-500 p-3 bg-gray-50 border"
                  >
                    <option value="single">Single</option>
                    <option value="married">Married Filing Jointly</option>
                  </select>
                </div>
              </section>

              <section>
                <h2 className="text-xl font-bold text-gray-900 mb-4">2. W-2 Income (Gym Paycheck)</h2>
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  <div>
                    <label className="block text-sm font-medium text-gray-700 mb-1">Annual W-2 Wages ($)</label>
                    <input type="number" id="w2Wages" min="0" value={inputs.w2Wages || ""} onChange={(e) => handleInputChange("w2Wages", e.target.value)} className="w-full rounded-lg border-gray-300 shadow-sm p-3 bg-gray-50 border" />
                  </div>
                  <div>
                    <label className="block text-sm font-medium text-gray-700 mb-1">Tax Already Withheld ($)</label>
                    <input type="number" min="0" value={inputs.w2Withheld || ""} onChange={(e) => handleInputChange("w2Withheld", e.target.value)} className="w-full rounded-lg border-gray-300 shadow-sm p-3 bg-gray-50 border" />
                  </div>
                </div>
              </section>

              <section>
                <h2 className="text-xl font-bold text-gray-900 mb-4">3. 1099 / Self-Employment Income</h2>
                <div className="mb-6">
                  <label className="block text-sm font-medium text-gray-700 mb-1">Gross Training Income ($)</label>
                  <input type="number" id="gross1099" min="0" value={inputs.gross1099 || ""} onChange={(e) => handleInputChange("gross1099", e.target.value)} className="w-full rounded-lg border-brand-300 p-4 bg-brand-50 border text-lg font-semibold text-brand-900" />
                </div>
                
                <h3 className="text-lg font-semibold text-gray-900 mb-3 border-b pb-2">Did you deduct these?</h3>
                <div className="space-y-4">
                  <DeductionInput label="Certifications & CEUs" hint="NASM, ACE, renewals" value={inputs.deductions.certs} onChange={(v) => handleDeductionChange("certs", v)} />
                  <DeductionInput label="Liability Insurance" hint="Usually $150-$300/year" value={inputs.deductions.liabilityIns} onChange={(v) => handleDeductionChange("liabilityIns", v)} />
                  <DeductionInput label="Gym Rental / Split" hint="Booth fees paid to studio" value={inputs.deductions.gymRent} onChange={(v) => handleDeductionChange("gymRent", v)} />
                  <DeductionInput label="Equipment" hint="Weights, bands, wearables" value={inputs.deductions.equipment} onChange={(v) => handleDeductionChange("equipment", v)} />
                  <DeductionInput label="Coaching Software" hint="Trainerize, TrueCoach" value={inputs.deductions.software} onChange={(v) => handleDeductionChange("software", v)} />
                  <DeductionInput label="Business Mileage" hint="Miles driven" value={inputs.deductions.mileage} onChange={(v) => handleDeductionChange("mileage", v)} prefix="miles" />
                </div>
              </section>

              <div className="flex flex-col sm:flex-row gap-4 pt-4 border-t border-gray-100">
                <button 
                  onClick={handleCalculate}
                  className="flex-1 bg-brand-600 hover:bg-brand-700 text-white font-bold py-3 px-6 rounded-xl shadow-md transition-colors text-lg"
                >
                  Calculate
                </button>
                <button 
                  onClick={handleReset}
                  className="sm:w-auto px-6 py-3 bg-white border-2 border-gray-200 hover:border-gray-300 text-gray-700 font-semibold rounded-xl transition-colors"
                >
                  Reset
                </button>
              </div>
            </div>

            <div className="lg:col-span-5 relative" ref={resultsRef}>
              <div className="sticky top-6 bg-dark text-white p-6 sm:p-8 rounded-2xl shadow-xl flex flex-col">
                <h2 className="text-xl font-bold mb-6 text-brand-100 border-b border-gray-700 pb-3">Your Tax Estimate</h2>
                
                {results.isLoss && (
                  <div className="mb-6 p-4 bg-amber-500/20 border border-amber-500/50 rounded-lg">
                    <p className="text-amber-200 text-sm leading-relaxed">
                      Your deductible expenses exceed your training income this year — this usually means a business loss. This calculator doesn't handle loss carryforwards; consider talking to a tax professional.
                    </p>
                  </div>
                )}
                
                <div className="space-y-4 flex-grow">
                  <ResultRow label="Net SE Profit" value={results.netSeProfit} highlight />
                  <ResultRow label="Total SE Tax" value={results.seTax.total} />
                  <ResultRow label="Federal Income Tax" value={results.federalTax} />
                  <ResultRow label="Total Liability" value={results.totalLiability} />
                </div>

                <div className="mt-8 bg-brand-600 rounded-xl p-5 text-center shadow-inner">
                  <p className="text-sm text-brand-100 mb-1 font-medium">Estimated Amount Owed</p>
                  <p id="amountOwed" className="text-4xl font-extrabold text-white mb-4">${results.amountOwed.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</p>
                </div>
              </div>
            </div>
          </div>
        </main>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<Calculator />);
  </script>
</body>
</html>
