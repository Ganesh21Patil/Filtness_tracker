<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Fitness Coach Tax Calculator</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Outfit', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#f0fdfa', 100: '#ccfbf1', 200: '#99f6e4', 300: '#5eead4', 400: '#2dd4bf', 500: '#14b8a6', 
              600: '#0d9488', 700: '#0f766e', 800: '#115e59', 900: '#134e4a'
            },
            dark: '#0f172a', /* Deepened from #111827 for higher contrast */
          },
          boxShadow: {
            'glow': '0 0 15px rgba(20, 184, 166, 0.3)',
            'float': '0 20px 40px -15px rgba(0, 0, 0, 0.5)',
          }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-50 text-dark antialiased font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const TAX_CONFIG = {
      TAX_YEAR: 2026,
      SS_WAGE_BASE: 184500,
      MILEAGE_RATE: 0.67,
      SURTAX_THRESHOLDS: { single: 200000, married: 250000 },
      STANDARD_DEDUCTIONS: { single: 16100, married: 32200 },
      FEDERAL_BRACKETS: {
        single: [
          { start: 640600, rate: 0.37 }, { start: 256225, rate: 0.35 },
          { start: 201775, rate: 0.32 }, { start: 105700, rate: 0.24 },
          { start: 50400, rate: 0.22 }, { start: 12400, rate: 0.12 }, { start: 0, rate: 0.10 },
        ],
        married: [
          { start: 768700, rate: 0.37 }, { start: 512450, rate: 0.35 },
          { start: 403550, rate: 0.32 }, { start: 211400, rate: 0.24 },
          { start: 100800, rate: 0.22 }, { start: 24800, rate: 0.12 }, { start: 0, rate: 0.10 },
        ],
      },
    };

    function calculateTaxes(inputs) {
      const num = (val) => Number(val) || 0;
      const d = inputs.deductions;
      const mileageDeduction = num(d.mileage) * TAX_CONFIG.MILEAGE_RATE;
      const deductionsSum =
        num(d.certs) + num(d.liabilityIns) + num(d.gymRent) + num(d.equipment) +
        num(d.software) + mileageDeduction + num(d.apparel) + num(d.marketing) +
        num(d.homeOffice) + num(d.other);

      const gross1099 = num(inputs.gross1099);
      const w2Wages = num(inputs.w2Wages);
      const w2Withheld = num(inputs.w2Withheld);

      const isLoss = deductionsSum > gross1099;
      const netSeProfit = Math.max(0, gross1099 - deductionsSum);
      const seTaxableIncome = netSeProfit * 0.9235;

      const wageBaseRemaining = Math.max(0, TAX_CONFIG.SS_WAGE_BASE - w2Wages);
      const ssTax = Math.min(seTaxableIncome, wageBaseRemaining) * 0.124;
      const medicareTax = seTaxableIncome * 0.029;

      const surtaxThreshold = TAX_CONFIG.SURTAX_THRESHOLDS[inputs.filingStatus];
      const combinedIncome = w2Wages + seTaxableIncome;
      const amountOverThreshold = Math.max(0, combinedIncome - surtaxThreshold);
      const surtax = amountOverThreshold * 0.009;

      const totalSeTax = ssTax + medicareTax + surtax;
      const halfSeTax = totalSeTax / 2.0;

      const netAfterHalfSe = Math.max(0, netSeProfit - halfSeTax);
      const qbiDeduction = netAfterHalfSe * 0.20;

      const standardDeduction = TAX_CONFIG.STANDARD_DEDUCTIONS[inputs.filingStatus];
      const taxableIncome = Math.max(
        0,
        w2Wages + netSeProfit - halfSeTax - qbiDeduction - standardDeduction
      );

      const brackets = TAX_CONFIG.FEDERAL_BRACKETS[inputs.filingStatus];
      let federalTax = 0;
      let remainingIncome = taxableIncome;

      for (const bracket of brackets) {
        if (remainingIncome > bracket.start) {
          const taxableInBracket = remainingIncome - bracket.start;
          federalTax += taxableInBracket * bracket.rate;
          remainingIncome = bracket.start;
        }
      }

      const totalLiability = federalTax + totalSeTax;
      const amountOwed = Math.max(0, totalLiability - w2Withheld);
      const quarterly = amountOwed / 4.0;

      return {
        netSeProfit: netSeProfit,
        seTax: {
          socialSecurity: ssTax,
          medicare: medicareTax,
          additionalMedicare: surtax,
          total: totalSeTax,
        },
        federalTax: federalTax,
        totalLiability: totalLiability,
        amountOwed: amountOwed,
        quarterlyPayment: quarterly,
        isLoss: isLoss,
      };
    }

    function formatNumber(val) {
      if (!val) return "";
      return new Intl.NumberFormat('en-US').format(val);
    }

    function AnimatedNumber({ value, prefix = "$", duration = 800 }) {
      const [displayValue, setDisplayValue] = useState(0);

      useEffect(() => {
        let startTimestamp = null;
        let animationFrameId;
        
        // Always start animating from current display value to make it smooth across recalculations
        const startValue = displayValue;
        const endValue = value;
        const change = endValue - startValue;

        if (change === 0) {
          setDisplayValue(endValue);
          return;
        }

        const step = (timestamp) => {
          if (!startTimestamp) startTimestamp = timestamp;
          const progress = Math.min((timestamp - startTimestamp) / duration, 1);
          // easeOutExpo for that premium deceleration
          const easeProgress = progress === 1 ? 1 : 1 - Math.pow(2, -10 * progress);
          
          setDisplayValue(Math.floor(startValue + change * easeProgress));

          if (progress < 1) {
            animationFrameId = window.requestAnimationFrame(step);
          } else {
            setDisplayValue(endValue);
          }
        };

        animationFrameId = window.requestAnimationFrame(step);
        return () => window.cancelAnimationFrame(animationFrameId);
      }, [value]);

      return <span>{prefix === "$" ? "$" : ""}{displayValue.toLocaleString('en-US')}</span>;
    }

    function Navbar() {
      return (
        <nav className="bg-white/80 backdrop-blur-md border-b border-gray-100 sticky top-0 z-50">
          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div className="flex justify-between items-center h-20">
              <div className="flex items-center gap-2 cursor-pointer group">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="h-9 w-9 text-brand-600 transition-transform group-hover:scale-110">
                  <path d="M3 21h18" strokeWidth="1.5" strokeOpacity="0.3" />
                  <path d="M20 21v-8M15 21v-5M10 21v-3" strokeWidth="4" strokeOpacity="0.15" />
                  <path d="M4 16l5-4 4 2 6-7" strokeWidth="2.5" />
                  <path d="M14.5 13.5l1.5-3 3 1" strokeWidth="2" />
                  <path d="M8.5 16l2-4 3 2" strokeWidth="2" />
                  <circle cx="16" cy="5" r="1.5" fill="currentColor" stroke="none" />
                </svg>
                <span className="text-2xl font-display font-extrabold text-gray-900 tracking-tight">TrainerLedger</span>
              </div>
              <div className="hidden lg:flex items-center space-x-8">
                <a href="#" className="text-gray-600 hover:text-brand-600 font-semibold transition-colors">Calculator</a>
                <a href="#" className="text-gray-600 hover:text-brand-600 font-semibold transition-colors flex items-center gap-1">Guides</a>
                <a href="#" className="text-gray-600 hover:text-brand-600 font-semibold transition-colors">Pricing</a>
                <a href="#" className="text-gray-600 hover:text-brand-600 font-semibold transition-colors flex items-center gap-1">Resources</a>
                <a href="#" className="text-gray-600 hover:text-brand-600 font-semibold transition-colors">About</a>
              </div>
              <div className="flex items-center space-x-3 sm:space-x-4">
                <a href="#" className="hidden sm:inline-block text-gray-600 hover:text-gray-900 font-semibold px-3 py-2 transition-colors">Login</a>
                <a href="#" className="bg-brand-600 hover:bg-brand-700 hover:shadow-lg hover:shadow-brand-500/30 text-white font-semibold px-5 py-2.5 rounded-xl transition-all duration-300 text-sm">Sign up for free</a>
              </div>
            </div>
          </div>
        </nav>
      );
    }

    function FormattedInput({ value, onChange, className, prefix = "$", id }) {
      const [isFocused, setIsFocused] = useState(false);
      const displayValue = isFocused ? value : (value ? formatNumber(value) : "");
      
      return (
        <div className="relative w-full group">
          {prefix === "$" && <span className={`absolute left-4 top-1/2 -translate-y-1/2 font-medium transition-colors duration-200 ${isFocused ? 'text-brand-500' : 'text-gray-400'}`}>$</span>}
          <input
            id={id}
            type="text"
            inputMode="numeric"
            value={displayValue}
            onFocus={() => setIsFocused(true)}
            onBlur={() => setIsFocused(false)}
            onChange={(e) => {
              const raw = e.target.value.replace(/[^0-9]/g, '');
              onChange(raw);
            }}
            className={`${className} font-display transition-all duration-200 focus:outline-none ${prefix === "$" ? "pl-8" : "pr-14"}`}
            placeholder="0"
          />
          {prefix !== "$" && <span className={`absolute right-4 top-1/2 -translate-y-1/2 font-medium text-sm transition-colors duration-200 ${isFocused ? 'text-brand-500' : 'text-gray-400'}`}>{prefix}</span>}
        </div>
      );
    }

    function DeductionInput({ label, hint, value, onChange, prefix = "$", tooltipText }) {
      const [showTooltip, setShowTooltip] = useState(false);
      
      return (
        <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 p-3 bg-white border border-gray-100 rounded-xl shadow-sm hover:shadow-md hover:border-brand-200 focus-within:ring-2 focus-within:ring-brand-500/20 focus-within:border-brand-400 transition-all duration-300 relative group">
          <div className="flex-1 flex items-start px-1">
            <div className="flex-1">
              <label className="block text-sm font-semibold text-gray-800 tracking-tight">{label}</label>
              <p className="text-xs text-gray-500 mt-0.5">{hint}</p>
            </div>
            {tooltipText && (
              <div 
                className="relative ml-2 flex-shrink-0"
                onMouseEnter={() => setShowTooltip(true)}
                onMouseLeave={() => setShowTooltip(false)}
              >
                <button 
                  type="button" 
                  onClick={() => setShowTooltip(!showTooltip)} 
                  className="text-gray-400 hover:text-brand-600 focus:outline-none focus:text-brand-600 p-1 rounded-full transition-colors"
                  aria-label={`More information about ${label}`}
                >
                  <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                </button>
                
                {showTooltip && (
                  <div className="absolute z-50 w-64 p-3 mt-2 text-sm text-gray-600 bg-white border border-gray-100 rounded-xl shadow-xl right-0 sm:left-1/2 sm:right-auto sm:-translate-x-1/2 transition-opacity">
                    <p className="leading-relaxed">{tooltipText}</p>
                  </div>
                )}
              </div>
            )}
          </div>
          <div className="w-full sm:w-36 flex-shrink-0">
            <FormattedInput 
              value={value} 
              onChange={onChange} 
              prefix={prefix} 
              className="w-full rounded-lg border-gray-200 bg-gray-50/50 p-2 text-gray-900 font-medium text-right border focus:bg-white" 
            />
          </div>
        </div>
      );
    }

    function ResultRow({ label, value, sub, bold, highlight }) {
      return (
        <div className={`flex justify-between items-center ${sub ? "text-gray-400 text-sm pl-2" : highlight ? "text-brand-300 font-semibold" : bold ? "font-semibold text-white" : "text-gray-300"}`}>
          <span>{label}</span>
          <span className="font-display tracking-wide">{value < 0 ? "-" : ""}<AnimatedNumber value={Math.abs(value)} /></span>
        </div>
      );
    }

    function Calculator() {
      const resultsRef = React.useRef(null);
      const initialInputs = {
        filingStatus: "single", w2Wages: "", w2Withheld: "", gross1099: "",
        deductions: {
          certs: "", liabilityIns: "", gymRent: "", equipment: "", software: "",
          mileage: "", apparel: "", marketing: "", homeOffice: "", other: "",
        },
      };
      const [inputs, setInputs] = useState(initialInputs);
      const [hasCalculated, setHasCalculated] = useState(false);
      const [showHow, setShowHow] = useState(false);

      const handleCalculate = () => {
        setHasCalculated(true);
        if (resultsRef.current && window.innerWidth < 1024) {
          resultsRef.current.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
      };

      const handleReset = () => {
        if (window.confirm("Are you sure you want to clear all fields?")) {
          setInputs(initialInputs);
          setHasCalculated(false);
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }
      };

      const handleKeyDown = (e) => {
        if (e.key === 'Enter') {
          handleCalculate();
        }
      };

      const handleInputChange = (field, value) => {
        setInputs((prev) => ({ ...prev, [field]: value }));
      };

      const handleDeductionChange = (field, value) => {
        setInputs((prev) => ({
          ...prev,
          deductions: { ...prev.deductions, [field]: value },
        }));
      };

      const results = calculateTaxes(inputs);

      return (
        <main className="flex flex-col items-center py-12 px-4 sm:px-6 lg:px-8">
          <div className="w-full max-w-4xl text-center mb-12">
            <h1 className="text-4xl md:text-5xl lg:text-6xl font-display font-extrabold text-dark tracking-tight mb-5">
              Estimate your personal trainer taxes <span className="text-transparent bg-clip-text bg-gradient-to-r from-brand-600 to-brand-400">in 60 seconds</span>
            </h1>
            <p className="text-lg text-gray-500 max-w-2xl mx-auto">
              Built for independent trainers, gym contractors, and hybrid coaches. Find the deductions most trainers miss and see exactly what you owe.
            </p>
          </div>

          <div className="w-full max-w-5xl grid grid-cols-1 lg:grid-cols-12 gap-8 lg:gap-12 items-start">
            <div className="lg:col-span-7 space-y-10 bg-white p-6 sm:p-10 rounded-[2rem] shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-gray-100" onKeyDown={handleKeyDown}>
              <section>
                <h2 className="text-2xl font-display font-bold text-gray-900 mb-5">1. The Basics</h2>
                <div>
                  <label className="block text-sm font-semibold text-gray-700 mb-2">Filing Status</label>
                  <select
                    value={inputs.filingStatus}
                    onChange={(e) => handleInputChange("filingStatus", e.target.value)}
                    className="w-full rounded-xl border-gray-200 shadow-sm focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 p-3.5 bg-gray-50 border transition-all cursor-pointer font-medium"
                  >
                    <option value="single">Single</option>
                    <option value="married">Married Filing Jointly</option>
                  </select>
                </div>
              </section>

              <section>
                <h2 className="text-2xl font-display font-bold text-gray-900 mb-5">2. W-2 Income <span className="text-gray-400 font-medium text-lg">(Gym Paycheck)</span></h2>
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-5">
                  <div>
                    <label className="block text-sm font-semibold text-gray-700 mb-2">Annual W-2 Wages</label>
                    <FormattedInput id="w2Wages" value={inputs.w2Wages} onChange={(v) => handleInputChange("w2Wages", v)} className="w-full rounded-xl border-gray-200 shadow-sm p-3.5 bg-gray-50 border focus:bg-white focus:border-brand-400 focus:ring-2 focus:ring-brand-500/20" />
                  </div>
                  <div>
                    <label className="block text-sm font-semibold text-gray-700 mb-2">Tax Already Withheld</label>
                    <FormattedInput value={inputs.w2Withheld} onChange={(v) => handleInputChange("w2Withheld", v)} className="w-full rounded-xl border-gray-200 shadow-sm p-3.5 bg-gray-50 border focus:bg-white focus:border-brand-400 focus:ring-2 focus:ring-brand-500/20" />
                  </div>
                </div>
              </section>

              <section>
                <h2 className="text-2xl font-display font-bold text-gray-900 mb-5">3. 1099 / Self-Employment Income</h2>
                <div className="mb-8">
                  <label className="block text-sm font-bold text-brand-900 mb-2">Gross Training Income ($)</label>
                  <FormattedInput id="gross1099" value={inputs.gross1099} onChange={(v) => handleInputChange("gross1099", v)} className="w-full rounded-2xl border-brand-300 shadow-inner p-5 bg-brand-50 border-2 text-2xl font-bold text-brand-900 focus:bg-white focus:ring-4 focus:ring-brand-500/20" />
                </div>
                
                <h3 className="text-lg font-display font-bold text-gray-900 mb-4 border-b border-gray-100 pb-2">Did you deduct these?</h3>
                <div className="space-y-3">
                  <DeductionInput label="Certifications & CEUs" hint="NASM, ACE, renewals" value={inputs.deductions.certs} onChange={(v) => handleDeductionChange("certs", v)} tooltipText="Professional certifications, continuing education, and training expenses may qualify when they are related to maintaining or improving your current business skills." />
                  <DeductionInput label="Liability Insurance" hint="Usually $150-$300/year" value={inputs.deductions.liabilityIns} onChange={(v) => handleDeductionChange("liabilityIns", v)} tooltipText="Business liability insurance used to protect your training business may generally qualify as a business expense." />
                  <DeductionInput label="Gym Rental / Split" hint="Booth fees paid to studio" value={inputs.deductions.gymRent} onChange={(v) => handleDeductionChange("gymRent", v)} tooltipText="Include the portion of gym or studio rental costs you pay to operate your training business." />
                  <DeductionInput label="Equipment" hint="Weights, bands, wearables" value={inputs.deductions.equipment} onChange={(v) => handleDeductionChange("equipment", v)} tooltipText="Business-use equipment such as weights, resistance bands, mats, or other training gear may qualify." />
                  <DeductionInput label="Coaching Software" hint="Trainerize, TrueCoach" value={inputs.deductions.software} onChange={(v) => handleDeductionChange("software", v)} tooltipText="Software used to run or support your training business may qualify." />
                  <DeductionInput label="Business Mileage" hint="Miles driven" value={inputs.deductions.mileage} onChange={(v) => handleDeductionChange("mileage", v)} prefix="miles" tooltipText="Generally, include qualifying business miles such as travel between clients. Normal commuting may not qualify." />
                </div>
              </section>

              <div className="flex flex-col sm:flex-row gap-4 pt-6 mt-4">
                <button 
                  onClick={handleCalculate}
                  className="flex-1 bg-brand-600 hover:bg-brand-500 text-white font-bold py-4 px-6 rounded-2xl shadow-lg hover:shadow-brand-500/40 hover:-translate-y-1 transition-all duration-300 text-lg flex items-center justify-center gap-2 font-display tracking-wide"
                >
                  {hasCalculated ? (
                    <><svg className="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M5 13l4 4L19 7" /></svg> Estimate Updated</>
                  ) : (
                    "Calculate My Estimate"
                  )}
                </button>
                <button 
                  onClick={handleReset}
                  className="sm:w-auto px-8 py-4 bg-white border-2 border-gray-200 hover:border-gray-300 hover:bg-gray-50 text-gray-600 font-bold rounded-2xl transition-all duration-200"
                >
                  Reset
                </button>
              </div>
            </div>

            <div className="lg:col-span-5 relative" ref={resultsRef}>
              <div className="lg:sticky lg:top-28 bg-dark text-white p-8 sm:p-10 rounded-[2rem] shadow-float border border-gray-800 flex flex-col relative overflow-hidden group">
                {/* Decorative background glow */}
                <div className="absolute -top-24 -right-24 w-48 h-48 bg-brand-500/20 rounded-full blur-3xl transition-opacity duration-700 opacity-50 group-hover:opacity-100 pointer-events-none"></div>

                <h2 className="text-xl font-display font-bold mb-8 text-brand-100 border-b border-gray-700 pb-4 flex justify-between items-center relative z-10">
                  Your Tax Estimate
                  {hasCalculated && <span className="text-[10px] uppercase tracking-wider font-extrabold bg-brand-500 text-dark px-2.5 py-1 rounded-full">2026</span>}
                </h2>
                
                {!hasCalculated ? (
                  <div className="flex flex-col items-center justify-center py-16 text-center relative z-10">
                    <p className="text-gray-400 mb-4 font-medium leading-relaxed">Enter your information and calculate your estimate.</p>
                    <p className="text-6xl font-display font-extrabold text-gray-700 mt-2 tracking-tighter">$—</p>
                  </div>
                ) : (
                  <div className="animate-fade-in relative z-10">
                    {results.isLoss && (
                      <div className="mb-6 p-4 bg-amber-500/10 border border-amber-500/30 rounded-xl">
                        <p className="text-amber-300 text-sm leading-relaxed font-medium">
                          Your deductible expenses exceed your training income this year. Consider talking to a tax professional about business losses.
                        </p>
                      </div>
                    )}
                    
                    <div className="space-y-5 flex-grow">
                      <ResultRow label="Net SE Profit" value={results.netSeProfit} highlight />
                      <ResultRow label="Total SE Tax" value={results.seTax.total} />
                      <ResultRow label="Federal Income Tax" value={results.federalTax} />
                      <ResultRow label="Total Liability" value={results.totalLiability} />
                    </div>

                    <div className="mt-10 bg-gradient-to-br from-brand-600 to-brand-800 rounded-2xl p-6 sm:p-8 text-center shadow-lg shadow-brand-900/50 relative overflow-hidden border border-brand-500/30">
                      <p className="text-sm text-brand-100 mb-2 font-semibold uppercase tracking-wider">Estimated Amount Owed</p>
                      <p className="text-5xl font-display font-extrabold text-white tracking-tighter">
                        <AnimatedNumber value={results.amountOwed} />
                      </p>
                    </div>
                    
                    <div className="mt-6 text-center">
                      <p className="text-xs text-gray-500 leading-relaxed font-medium">Based on the information you provided.<br/>Estimate only. Your actual tax liability may vary.</p>
                    </div>
                  </div>
                )}
              </div>
            </div>
          </div>
          
          {hasCalculated && (
            <div className="w-full max-w-4xl mt-16 animate-fade-in">
              <div className="text-center mb-10">
                <h3 className="text-xs uppercase tracking-widest text-brand-600 font-bold mb-3">What's next?</h3>
                <h2 className="text-4xl font-display font-bold text-gray-900 mb-3 tracking-tight">Your estimate is ready.</h2>
                <p className="text-lg text-gray-500 font-medium">Choose what you'd like to do next.</p>
              </div>
              
              <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-16">
